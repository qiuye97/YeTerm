# ─────────────────────────────────────────────────────────────────────────────
# 持续集成:每次 push / PR,在 GitHub 的干净 Mac 上从零编译一遍并跑自测。
#
# 为什么只做这三件事(而不是把本机那套自测全搬上来):
#   本项目的自测体系里有大量**逐像素比对**(--render-demo --tolerance 0)和
#   **GUI 探针**(实例化 NSWindow、合成真实键盘事件)。CI 跑在虚拟机里,
#   Metal 走虚拟化 GPU、没有常规的图形会话 —— 那些断言在这里不一定稳,
#   一旦误报红,CI 就从「有用的信号」变成「一直红的噪音」,反而没人看了。
#   所以这里只留**实测在 CI 上稳定**的三条:
#     ① swift build      —— 抓「只有作者机器上能编译」(比如漏 git add 了新文件)
#     ② --smoke-term     —— 终端内核(无 GUI、无 GPU,纯逻辑)
#     ③ --probe-settings —— 73 条断言:配置库 / 预设完整性 / i18n 译文覆盖与
#                           占位符一致性 / 设置页逐页渲染非空白。
#                           首次实测确认:GitHub 的 macOS runner **有图形会话**,
#                           NSWindow 与 SwiftUI 渲染都正常,所以这条要求必须通过
#                           (不做「起不来就跳过」的软处理 —— 那会在它真的坏掉时
#                            绿着糊弄过去)。
#   仍然只在本机跑的:verify_m0.sh 的**逐像素比对**(--tolerance 0)与 auto-drive
#   的合成键盘事件 —— 前者依赖 GPU 结果逐位一致,CI 是虚拟化 GPU,没验证过。
#
# runner 用 macos-26:它是 arm64(与本项目的 Apple Silicon 目标一致),
# 且预装 Xcode 26.x —— 本项目需要 SDK ≥ 26(设置页用了 macOS 26 的新设计 API,
# 全部有 #available 保护,但编译期要求 SDK 里有它们)。
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # 也允许在网页上手动点一下触发

# 同一分支连续推送时,取消上一次还没跑完的,省时间也省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 + 自测
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v5

      - name: 记录工具链版本(排查环境差异时第一个要看的)
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          xcrun --sdk macosx --show-sdk-version

      - name: 构建
        run: swift build

      - name: 内核冒烟(CJK 宽字符 / 颜色 / 属性解码)
        run: |
          swift run YeTerm --smoke-term | tee /tmp/smoke.log
          grep -q "SMOKE-PASS" /tmp/smoke.log

      - name: 设置探针(73 条断言:配置库 / 预设完整性 / i18n 覆盖 / 逐页渲染非空白)
        run: |
          swift run YeTerm --probe-settings /tmp/probe 2>&1 | tee /tmp/probe.log
          grep -q "SETTINGS-PROBE-PASS" /tmp/probe.log
